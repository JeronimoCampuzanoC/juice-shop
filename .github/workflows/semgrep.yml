name: SAST - Semgrep

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Escaneo SAST
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: pip install semgrep
      - name: Escaneo SAST (gate sobre login.ts)
        run: |
          semgrep scan \
            --config p/javascript --config p/typescript \
            --metrics=off \
            --include "routes/login.ts" \
            --dataflow-traces \
            --sarif-output=semgrep.sarif \
            --error .
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-resultados
          path: semgrep.sarif